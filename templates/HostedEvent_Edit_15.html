<script>
  var checkB = document.getElementById("checkbox-7f93")
  var checkC = document.getElementById("checkbox-ec0f")

  checkB.onchange = function() {
     if (checkB.checked) {
        document.getElementById("select-6b2d").removeAttribute("disabled");
        document.getElementById("select-6bb2d").removeAttribute("disabled");
        
     } else {
        document.getElementById("select-6b2d").setAttribute("disabled","disabled")
        document.getElementById("select-6bb2d").setAttribute("disabled","disabled")
     }
  }
  checkC.onchange = function() {
     if (checkC.checked) {
        document.getElementById("select-2690").removeAttribute("disabled");
        document.getElementById("select-110d").removeAttribute("disabled");
        document.getElementById("select-d93e").removeAttribute("disabled");
        document.getElementById("select-be80").removeAttribute("disabled");
     } else {
        document.getElementById("select-2690").setAttribute("disabled","disabled")
        document.getElementById("select-110d").setAttribute("disabled","disabled")
        document.getElementById("select-d93e").setAttribute("disabled","disabled")
        document.getElementById("select-be80").setAttribute("disabled","disabled")
     }
  }  
  $(".bouton").click(function(){
	  $("#modal .message").html("Contenu de ma modal");
	  $("#modal").addClass("open");
  });
  $("#modal .mask, #modal a.close").click(function(){
	  $("#modal").removeClass("open");
	  return false;
  });
</script>
